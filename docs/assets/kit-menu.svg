<text x="22" y="186" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#f6f6f8">  ──────────────────────────────────────</text>
<text x="22" y="208" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#8b919e">   0. Выйти</text>
<text x="22" y="230" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   1. Адрес панели и логин</text>
<text x="22" y="252" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   2. Сбросить пароль администратора</text>
<text x="22" y="274" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   3. Выключить двухфакторный вход (2FA)</text>
<text x="22" y="296" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   4. Сменить порт панели</text>
<text x="22" y="318" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#f6f6f8">  ── Служба ─────────────────────────────</text>
<text x="22" y="340" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   5. Запустить</text>
<text x="22" y="362" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   6. Остановить</text>
<text x="22" y="384" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   7. Перезапустить</text>
<text x="22" y="406" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   8. Состояние</text>
<text x="22" y="428" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">   9. Журнал</text>
<text x="22" y="450" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">  10. Автозапуск: включён</text>
<text x="22" y="472" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#f6f6f8">  ── Обслуживание ───────────────────────</text>
<text x="22" y="494" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">  11. Скачать или обновить ядра</text>
<text x="22" y="516" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">  12. Обновить Kitsune</text>
<text x="22" y="538" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">  13. Удалить Kitsune</text>
<text x="22" y="560" xml:space="preserve" font-family="SF Mono,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#d7dae0">  14. HTTPS панели (сертификат)</text>
